<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID OS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- boot -->
<div id="boot" class="boot">
  <div class="boot-logo">VOID OS</div>
  <div class="boot-sub">cube-powered • ram-friendly • no build</div>
  <div class="boot-log" id="boot-log">initializing void...</div>
  <div class="boot-bar"><div id="boot-fill"></div></div>
</div>

<!-- desktop -->
<div id="desktop" class="desktop hidden">
  <div class="wallpaper"></div>
  <div class="void-grid"></div>
  <div class="scanlines"></div>
  <div class="void-cube" aria-hidden="true"><div class="vc-face"></div></div>

  <div id="icons" class="icons">
    <div class="icon" data-app="terminal" title="cube# terminal">
      <div class="icon-glyph">⌨</div>
      <div class="icon-label">cube#</div>
    </div>
    <div class="icon" data-app="cube" title="obj">
      <div class="icon-glyph">◈</div>
      <div class="icon-label">obj</div>
    </div>
    <div class="icon" data-app="reactor" title="reactor">
      <div class="icon-glyph">☢</div>
      <div class="icon-label">reactor</div>
    </div>
    <div class="icon" data-app="voidrecords" title="void records">
      <div class="icon-glyph">♫</div>
      <div class="icon-label">void records</div>
    </div>
    <div class="icon" data-app="lorebook" title="lorebook / transmissions">
      <div class="icon-glyph">✦</div>
      <div class="icon-label">lorebook</div>
    </div>
    <div class="icon" data-app="luxvidia" title="luxvidia control panel">
      <div class="icon-glyph">🥭</div>
      <div class="icon-label">luxvidia</div>
    </div>
    <div class="icon" data-app="files" title="file void">
      <div class="icon-glyph">📁</div>
      <div class="icon-label">files</div>
    </div>
  </div>

  <div id="windows" class="windows"></div>

  <div id="obj" class="obj" title="obj is watching">
    <div class="obj-cube"></div>
    <div class="obj-bubble hidden"></div>
  </div>

  <div id="taskbar" class="taskbar">
    <button id="start-btn" class="start-btn">VOID</button>
    <div id="taskbar-apps" class="taskbar-apps"></div>
    <div class="taskbar-spacer"></div>
    <div id="clock" class="clock">00:00</div>
  </div>

  <div id="start-menu" class="start-menu hidden">
    <div class="start-header">VOID OS</div>
    <div class="start-item" data-app="terminal">cube# terminal</div>
    <div class="start-item" data-app="cube">obj</div>
    <div class="start-item" data-app="reactor">reactor</div>
    <div class="start-item" data-app="voidrecords">void records</div>
    <div class="start-item" data-app="lorebook">lorebook</div>
    <div class="start-item" data-app="luxvidia">luxvidia panel</div>
    <div class="start-item" data-app="files">file void</div>
    <div class="start-sep"></div>
    <div class="start-item" data-action="shutdown">shutdown</div>
  </div>
</div>

<script src="tracks.js"></script>
<script src="script.js"></script>
</body>
</html>
